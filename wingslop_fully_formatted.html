<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#14100e">
  <title>WingSlop Employee Terminal</title>
  <style>
    :root {
      font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
      color:#f8e6cd;
      background:#120f0d}

    * {
      box-sizing:border-box}

    body {
      margin:0;
      background:radial-gradient(circle at top,#3b211b,#120f0d 65%);
      min-height:100vh}

    .wrap {
      max-width:780px;
      margin:auto;
      padding:20px 14px 50px}

    header {
      border:2px solid #e88b34;
      background:#27150e;
      padding:18px;
      text-align:center;
      box-shadow:6px 6px #090706}

    h1 {
      font-size:clamp(30px,7vw,48px);
      margin:0;
      color:#ffc04f;
      letter-spacing:3px}

    small,.muted {
      color:#c5ab92}

    .tag {
      letter-spacing:2px;
      color:#e7a874;
      font-size:12px}

    main {
      margin-top:18px;
      border:1px solid #79513c;
      background:#211813;
      padding:20px;
      min-height:380px}

    h2 {
      font-size:20px;
      color:#ffbd62;
      margin:0 0 14px}

    .stats {
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:8px;
      margin:14px 0}

    .stat {
      border:1px solid #624432;
      padding:9px;
      background:#2c201a;
      font-size:12px}

    .stat strong {
      display:block;
      font-size:18px;
      color:#ffce83}

    .story {
      white-space:pre-wrap;
      line-height:1.6;
      background:#160f0c;
      padding:14px;
      border-left:3px solid #ed8c36;
      margin:14px 0;
      overflow-wrap:anywhere}

    .actions {
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
      gap:9px;
      margin-top:15px}

    button {
      font:inherit;
      min-height:49px;
      border:1px solid #f1a04e;
      background:#603820;
      color:#fff0d9;
      padding:10px;
      cursor:pointer;
      text-align:left}

    button:hover,button:focus {
      background:#965324;
      outline:2px solid #ffce83}

    button:disabled {
      opacity:.45}

    input {
      width:100%;
      background:#100b09;
      border:1px solid #e6a158;
      color:white;
      padding:13px;
      font:inherit;
      font-size:16px}

    label {
      display:block;
      margin:12px 0 6px}

    .danger {
      color:#ff8176}

    .good {
      color:#9de0a5}

    .log {
      max-height:170px;
      overflow:auto;
      white-space:pre-wrap;
      font-size:12px;
      color:#d2b89e;
      margin-top:16px;
      border-top:1px dashed #71503b;
      padding-top:12px}

    footer {
      font-size:12px;
      color:#b6a18c;
      text-align:center;
      margin-top:15px}

    @media(max-width:450px) {
      .stats {
      grid-template-columns:repeat(2,1fr)}

    main {
      padding:14px}

    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="tag">CORPORATE PROPERTY • UNAUTHORIZED FUN PROHIBITED</div>
      <h1>🐔 WINGSLOP</h1>
      <small>EMPLOYEE TERMINAL // DEFINITELY FOOD</small>
    </header>
    <div id="app"></div>
    <footer>© WingSlop Corporate • The chicken is watching.</footer>
  </div>
  <script>
    'use strict';
    const $ = s => document.querySelector(s), rnd = n => Math.floor(Math.random()*n), pick = a => a[rnd(a.length)], names = ['Bob', 'Gerald', 'Geraldine', 'Boris', 'Bobbius', 'Beefo', 'Kookie', 'Gerard', 'Mortimer', 'Gorglebop'], menu = ['Buffalo wings', 'Nuclear wings', 'Slop nachos'], conds = ['nuclear biohazard', 'nearly uninhabitable', 'filthy', 'messy', 'squeaky clean'];
    const taskDefs = [['Clean the fryer', 3, 10], ['Mop the floor', 2, 8], ['Investigate suspicious sounds in the break room', 2, 5], ['Attend meeting held by the chicken mascot', 4, 2], ['Discover why the freezer is warmer than the dining area', 2, 4], ['Kick Gerard out of the employee bathroom', 3, 5], ['Tighten security to the experimental slop room', 4, 7], ['Replace the employee of the month photo (It\'s been the chicken the past 200 times)', 2, 1]];
    let g = null, screen = 'intro', message = '', log = [], round = 0, cs = 0, hs = 0, inspectorMove = 0, pattern = 0;
    const esc = s => String(s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
    function note(s){
      message = s;
      log.unshift(s);
      log = log.slice(0, 16)
    }
    function cond(){
      return conds[Math.floor(Math.min(99, g.san)/20)]
    }
    function end(title, story){
      g.ended = true;
      screen = 'end';
      note(story);
      g.ending = title;
      render()
    }
    function init(diff, ret){
      g = {
        diff, ret, day: 1, action: 1, served: 0, completed: 0, money: 0, xp: 0, rep: 50, wage: 20, bonus: 1, paymult: 1, rank: 0, security: 0, san: 100, pantry: {
          'Buffalo wings': 100, 'Nuclear wings': 50, 'Slop nachos': 20
        }, customers: [], tasks: [], ended: false
      };
      log = [];
      note('WELCOME TO YOUR SHIFT AT WINGSLOP. The chicken expects excellence.');
      startShift()
    }
    function weighted(items, weights){
      let t = weights.reduce((a, b) => a+b, 0), r = Math.random()*t;
      for(let i = 0; i<items.length; i++){
        r -= weights[i];
        if(r<0)return items[i]
      }
      return items.at(-1)
    }
    function addTask(){
      let avail = taskDefs.filter(t => !g.tasks.some(a => a.name === t[0]));
      if(!avail.length)return;
      let t = weighted(avail, avail.map(x => x[2]));
      g.tasks.push({
        name: t[0], duration: t[1]+(g.san<60?1: 0), progress: 0
      })
    }
    function startShift(){
      for(let i = 0; i<[3, 3, 4, 4][g.diff]; i++)addTask();
      if(rnd(50) === 0){
        screen = 'records';
        note('The chicken has left the confidential corporate records room slightly open.\nAUTHORIZED PERSONNEL ONLY! VIOLATORS WILL BE DEALT WITH BY THE CHICKEN!')
      } else {
        screen = 'main'
      }
      render()
    }
    function records(enter){
      if(enter){
        if(rnd(4) === 0)return end('THE ONE WHO KNEW', 'You were a BIT too loud entering the room. The chicken caught you in the act. Goodbye, old friend.');
        if(rnd(10) === 0)note('You enter without being caught and find a confidential file:\nName: Harland Cluckanders\nAlias: The Chicken\nYear of Employment: 1842\nEmployer: [REDACTED]');
        else note('You enter without being caught, but find no interesting documents. Better luck next time...')
      } else note('You decide not to risk the wrath of the chicken.');
      screen = 'main';
      render()
    }
    function payroll(){
      let pay = (g.wage+g.bonus*5*g.completed+g.bonus*2*g.served)*g.paymult;
      g.money += pay;
      g.served = 0;
      g.completed = 0;
      g.paymult = 1;
      note(`You earn $${pay.toFixed(2)} for your shift! You now have $${g.money.toFixed(2)}.`);
      let ranks = [['Trainee', 0, 20, 1], ['Crew Member', 250, 30, 1.2], ['Senior Slopmaker', 1000, 50, 1.5]];
      if(g.rank<2 && g.xp >= ranks[g.rank+1][1]){
        g.rank++;
        g.wage = ranks[g.rank][2];
        g.bonus = ranks[g.rank][3];
        note('Congratulations! Promoted to '+ranks[g.rank][0]+'!')
      }
      if(g.ret && g.day === 10)return end('EMPLOYEE OF THE MILLENNIUM', 'You have been working for the chicken for 10 days now! You must be a really hard worker!');
      if(g.ret && g.money >= 375)return end('THE GREAT ESCAPE', 'You now have enough money to never be financially dependent on the chicken again!')
    }
    function discipline(){
      if(!g.tasks.length)return;
      let repPenalty = g.rep <= 25?2: g.rep <= 40?1: 0, idx = Math.max(0, Math.min(2, Math.min(g.tasks.length, 2)+repPenalty-1));
      let p = weighted(['Written warning', 'Slop Nacho force feeding', 'Public humiliation', '10% Paycheck deduction', '30% Paycheck deduction', 'Termination'], [[50, 20, 5], [25, 25, 15], [15, 20, 20], [8, 20, 25], [1, 10, 20], [1, 5, 15]].map(a => a[idx]));
      note('THE CHICKEN HAS SUMMONED YOU. Unfinished assignments: '+g.tasks.length+'. DISCIPLINARY ACTION: '+p);
      if(p === 'Termination')return end('UNEMPLOYED', 'You have been fired from WingSlop.');
      if(p === 'Slop Nacho force feeding')g.xp = Math.max(0, g.xp-100);
      if(p === 'Public humiliation')g.rep = Math.max(0, g.rep-10);
      if(p === '10% Paycheck deduction')g.paymult = .9;
      if(p === '30% Paycheck deduction')g.paymult = .7
    }
    function tick(){
      if(g.action === 10){
        discipline();
        if(g.ended)return;
        payroll();
        if(g.ended)return;
        g.day++;
        g.action = 1
      } else g.action++;
      if(rnd([5, 4, 2, 1][g.diff]) === 0)g.san = Math.max(1, g.san-(3+rnd(8)));
      for(let i = g.customers.length-1; i >= 0; i--){
        let c = g.customers[i], offset = Math.floor((100-g.san)/5);
        c.patience = Math.max(0, c.patience-(5+offset+rnd(11)));
        if(c.patience === 0){
          g.rep -= 3;
          note(c.name+' ran out of patience! They are taking their business elsewhere.');
          g.customers.splice(i, 1)
        }
      }
      if(rnd([5, 4, 3, 2][g.diff]) === 0){
        let c = {
          name: pick(names), order: pick(menu), quantity: 1+rnd(5), patience: 50+rnd(51)
        };
        g.customers.push(c);
        note('A customer enters WingSlop. Say hi to '+c.name+'!')
      }
      if(g.action === 1){
        startShift();
        return
      }
      screen = 'main';
      render()
    }
    function checkInspector(){
      if(g.san<20 && rnd(g.san) === 0){
        if(g.diff === 3 && rnd(5) === 0){
          screen = 'name';
          note('A health inspector has arrived. He demands to know the owner\'s full government name.');
          render();
          return true
        }
        end('CAUTION: BIOHAZARD', 'A health inspector has arrived. WingSlop has been deemed a biohazard and a threat to humanity and chickenkind.');
        return true
      }
      return false
    }
    function act(type, index){
      if(g.ended)return;
      if(checkInspector())return;
      if(type === 'wait'){
        note('You wait. The chicken does not approve of idleness.');
        tick();
        return
      }
      if(type === 'work'){
        let t = g.tasks[index];
        if(!t)return;
        if(g.san<40 && rnd(5) === 4){
          note('You attempt to '+t.name.toLowerCase()+', but the restaurant\'s lack of sanitation stops you.');
          tick();
          return
        }
        t.progress++;
        note(`'${t.name}' worked on! Progress: ${t.progress}/${t.duration}`);
        if(t.progress >= t.duration){
          g.xp += t.duration*10;
          g.completed++;
          if(t.name === 'Mop the floor'){
            g.san = Math.min(100, g.san+(20-g.san%20)%20);
            note('WingSlop has been cleaned. Sanitation is now '+cond()+'.')
          }
          if(t.name === 'Tighten security to the experimental slop room'){
            g.security++;
            if(g.security >= 10)return end('FORT KNOX', 'The chicken congratulates you on your commitment to security. No one will EVER know what happens behind the experimental slop room door. You will NEVER leave WingSlop.')
          }
          if(t.name.startsWith('Restock ')){
            let item = menu.find(x => t.name === 'Restock '+x.toLowerCase());
            if(item)g.pantry[item] += {
              'Buffalo wings': 50, 'Nuclear wings': 25, 'Slop nachos': 20
            }[item]
          }
          g.tasks.splice(index, 1);
          note(`'${t.name}' task complete! (+${t.duration*10} XP)`)
        }
        tick();
        return
      }
      if(type === 'serve'){
        let c = g.customers[index];
        if(!c)return;
        if(g.pantry[c.order]<c.quantity)note('The kitchen does not have enough '+c.order+' to fulfill the order.');
        else if(g.san<40 && rnd(5) === 4)note('The fryer refused to turn on. Order could not be prepared.');
        else {
          g.pantry[c.order] -= c.quantity;
          g.xp += 50;
          g.rep += 2;
          g.served++;
          g.customers.splice(index, 1);
          note('You served '+c.name+'! (+50 XP)');
          for(let item of menu){
            if(g.pantry[item] <= 12 && !g.tasks.some(t => t.name === 'Restock '+item.toLowerCase()))g.tasks.push({
              name: 'Restock '+item.toLowerCase(), duration: item === 'Slop nachos'?4: 3, progress: 0
            })
          }
        }
        tick()
      }
    }
    function submitName(){
      let name = $('#nameGuess').value.trim().toLowerCase();
      if(name !== 'harland cluckanders')return end('CAUTION: BIOHAZARD', 'The inspector is angered that you did not tell him the chicken\'s government name. WingSlop has been shut down.');
      cs = 0;
      hs = 0;
      round = 0;
      pattern = 0;
      screen = 'rps';
      note('The inspector calls Harland Cluckanders. The chicken runs over. They begin playing ROCK PAPER SCISSORS, first to 5. You control the chicken.');
      render()
    }
    function rps(move){
      let im = round === 0?rnd(3): [1, 2, 0][(round-1)%3];
      let nm = ['Rock', 'Paper', 'Scissors'];
      let result = (move-im+3)%3;
      if(result === 1)cs++;
      else if(result === 2)hs++;
      round++;
      note(`Round ${round}: Chicken throws ${nm[move]}. Inspector throws ${nm[im]}. ${result===0?'TIE!':result===1?'CHICKEN WINS!':'INSPECTOR WINS!'} Score ${cs}–${hs} (chicken first).`);
      if(cs >= 5)return end('ARMAGEDDON', 'Congratulations! The chicken won! That may not be best for you, though. You still work at WingSlop, and he knows you somehow learned his government name...');
      if(hs >= 5)return end('CAUTION: BIOHAZARD', 'The inspector defeated the chicken at rock-paper-scissors and condemned WingSlop as a biohazard.');
      render()
    }
    function btn(text, fn){
      let b = document.createElement('button');
      b.textContent = text;
      b.onclick = fn;
      return b
    }
    function render(){
      let app = $('#app');
      app.innerHTML = '';
      let main = document.createElement('main');
      app.append(main);
      function h(s){
        let el = document.createElement('h2');
        el.textContent = s;
        main.append(el)
      }
      function story(s){
        let el = document.createElement('div');
        el.className = 'story';
        el.textContent = s;
        main.append(el)
      }
      function buttons(arr){
        let d = document.createElement('div');
        d.className = 'actions';
        main.append(d);
        for(let[label, fn]of arr)d.append(btn(label, fn))
      }
      if(screen === 'intro'){
        h('WELCOME, FUTURE SLOPMAKER');
        story('Employment is mandatory. Benefits are classified.\n\nChoose your difficulty and retirement policy.');
        buttons([['1. MILD', () => choose(0)], ['2. MEDIUM', () => choose(1)], ['3. SPICY', () => choose(2)], ['4. NUCLEAR', () => choose(3)]]);
        return
      }
      if(screen === 'ret'){
        h('RETIREMENT POLICY');
        story('Enable retirement endings? (Day 10 or $375.)');
        buttons([['Yes', () => init(chosenDiff, true)], ['No', () => init(chosenDiff, false)]]);
        return
      }
      if(g){
        let stats = document.createElement('div');
        stats.className = 'stats';
        stats.innerHTML = [['DAY / ACTION', g.day+' / '+g.action], ['SANITATION', g.san+'%'], ['REPUTATION', g.rep], ['MONEY', '$'+g.money.toFixed(2)], ['XP', g.xp], ['SECURITY', g.security]].map(([k, v]) => `<div class="stat">${esc(k)}<strong>${esc(v)}</strong></div>`).join('');
        main.append(stats)
      }
      if(screen === 'end'){
        h('ENDING UNLOCKED: '+g.ending);
        story(message);
        buttons([['START ANOTHER SHIFT (NEW GAME)', () => {
          g = null;
          screen = 'intro';
          render()
        }]]);
        return
      }
      if(screen === 'records'){
        h('CONFIDENTIAL RECORDS');
        story(message);
        buttons([['ENTER THE ROOM', () => records(true)], ['GO ABOUT YOUR NORMAL DAY', () => records(false)]]);
        return
      }
      if(screen === 'name'){
        h('HEALTH INSPECTOR');
        story(message);
        let l = document.createElement('label');
        l.textContent = 'Owner’s full government name';
        main.append(l);
        let inp = document.createElement('input');
        inp.id = 'nameGuess';
        inp.autocomplete = 'off';
        main.append(inp);
        buttons([['ANSWER THE INSPECTOR', submitName]]);
        return
      }
      if(screen === 'rps'){
        h('ARMAGEDDON — FINAL CONFRONTATION');
        story(message+'\n\nCHICKEN: '+cs+'   INSPECTOR: '+hs+'\nFIRST TO 5 WINS.');
        buttons([['✊ ROCK', () => rps(0)], ['✋ PAPER', () => rps(1)], ['✌️ SCISSORS', () => rps(2)]]);
        return
      }
      h(screen === 'main'?'WINGSLOP EMPLOYEE TERMINAL': screen === 'tasks'?'CURRENT ASSIGNMENTS': screen === 'customers'?'CUSTOMER ORDERS': screen === 'pantry'?'WINGSLOP PANTRY': 'SANITATION REPORT');
      if(message)story(message);
      if(screen === 'main')buttons([['VIEW TASKS', () => {
        screen = 'tasks';
        render()
      }], ['WORK ON TASK', () => {
        screen = 'work';
        render()
      }], ['VIEW CUSTOMERS', () => {
        screen = 'customers';
        render()
      }], ['SERVE CUSTOMER', () => {
        screen = 'serve';
        render()
      }], ['CHECK INVENTORY', () => {
        screen = 'pantry';
        render()
      }], ['CHECK SANITATION', () => {
        screen = 'sanitation';
        render()
      }], ['WAIT (1 ACTION)', () => act('wait')]]);
      if(screen === 'tasks' || screen === 'work'){
        story(g.tasks.length?g.tasks.map((t, i) => `${i+1}. ${t.name} (${t.progress}/${t.duration})`).join('\n'): 'No active tasks.');
        if(screen === 'work')buttons(g.tasks.map((t, i) => [t.name, () => act('work', i)]))
      }
      if(screen === 'customers' || screen === 'serve'){
        story(g.customers.length?g.customers.map((c, i) => `${i+1}. ${c.name} wants ${c.quantity} ${c.order} (${c.patience} patience)`).join('\n'): 'No customers currently waiting.');
        if(screen === 'serve')buttons(g.customers.map((c, i) => ['SERVE '+c.name+' — '+c.order, () => act('serve', i)]))
      }
      if(screen === 'pantry')story(menu.map(item => `${item}: ${g.pantry[item]}`).join('\n'));
      if(screen === 'sanitation')story('WingSlop is currently in a '+cond()+' sanitation state. ('+g.san+'%)');
      if(screen !== 'main')buttons([['← BACK TO TERMINAL', () => {
        screen = 'main';
        render()
      }]]);
      if(log.length){
        let e = document.createElement('div');
        e.className = 'log';
        e.textContent = 'SHIFT LOG\n'+log.slice(0, 6).join('\n———\n');
        main.append(e)
      }
    }
    let chosenDiff = 0;
    function choose(n){
      chosenDiff = n;
      screen = 'ret';
      render()
    }
    render();
  </script>
</body>
</html>
